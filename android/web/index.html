<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="color-scheme" content="dark light" />
  <title>FinanceTracker</title>
  <link rel="icon" href="/app/assets/icons/ft_logo.png" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/stlite/stlite.css" />
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b1220;
    }

    /* Schermata di avvio (resta finché la prima pagina non è pronta). */
    #ft-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background:
        radial-gradient(circle at 50% 30%, rgba(96, 165, 250, 0.18), transparent 55%),
        #0b1220;
      color: #eef3ff;
      font-family: "Manrope", system-ui, sans-serif;
      transition: opacity 260ms ease;
    }

    #ft-splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    #ft-splash img {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      animation: ft-pulse 1.8s ease-in-out infinite;
    }

    #ft-splash .ft-name {
      font-family: "Fraunces", Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    #ft-splash .ft-name span {
      color: #60a5fa;
    }

    #ft-splash .ft-bar {
      width: 160px;
      height: 4px;
      border-radius: 4px;
      background: rgba(148, 163, 184, 0.18);
      overflow: hidden;
    }

    #ft-splash .ft-bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 4px;
      background: #60a5fa;
      animation: ft-slide 1.1s ease-in-out infinite;
    }

    #ft-splash .ft-step {
      min-height: 18px;
      font-size: 13px;
      color: #94a3b8;
    }

    #ft-splash button {
      display: none;
      padding: 12px 22px;
      border: 0;
      border-radius: 12px;
      background: #60a5fa;
      color: #04203a;
      font: 700 15px "Manrope", system-ui, sans-serif;
    }

    #ft-splash.is-error button {
      display: block;
    }

    #ft-splash.is-error .ft-bar {
      display: none;
    }

    /* Primo avvio: scelta della cartella dei dati. */
    #ft-setup {
      display: none;
      max-width: 340px;
      padding: 0 24px;
      text-align: center;
    }

    #ft-splash.is-setup #ft-setup { display: block; }
    #ft-splash.is-setup .ft-bar,
    #ft-splash.is-setup .ft-step { display: none; }

    #ft-setup h2 {
      margin: 6px 0 10px;
      font: 700 21px "Fraunces", Georgia, serif;
      letter-spacing: -0.02em;
    }

    #ft-setup p {
      margin: 0 0 18px;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }

    #ft-setup button {
      display: block;
      width: 100%;
      margin: 0 0 10px;
      padding: 13px 18px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: transparent;
      color: #eef3ff;
      font: 700 15px "Manrope", system-ui, sans-serif;
    }

    #ft-setup button.is-primary {
      border: 0;
      background: #60a5fa;
      color: #04203a;
    }

    #ft-setup .ft-setup-error {
      min-height: 18px;
      color: #f87171;
      font-size: 13px;
    }

    @keyframes ft-slide {
      from { transform: translateX(-100%); }
      to { transform: translateX(250%); }
    }

    @keyframes ft-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <div id="ft-splash">
    <img src="/app/assets/icons/ft_logo.png" alt="" />
    <div class="ft-name">Finance<span>Tracker</span></div>
    <div class="ft-bar"></div>
    <div class="ft-step" id="ft-step">Avvio…</div>
    <div id="ft-setup">
      <h2>Dove salvo i tuoi dati?</h2>
      <p>Scegli una cartella del telefono, per esempio <b>Documenti/FinanceTracker</b>:
        lì trovi database, categorie e backup, come sul PC, e restano anche se
        disinstalli l'app. Se ci sono già dati FinanceTracker, li carico.</p>
      <button type="button" class="is-primary" id="ft-setup-pick">Scegli una cartella</button>
      <button type="button" id="ft-setup-skip">Più tardi (solo memoria dell'app)</button>
      <div class="ft-setup-error" id="ft-setup-error"></div>
    </div>
    <button type="button" onclick="location.reload()">Riprova</button>
  </div>
  <div id="root"></div>

  <script src="/android-bridge.js"></script>
  <script src="/touch.js"></script>
  <script type="module">
    import { mount } from "/stlite/stlite.js";
    import * as native from "/native.js";

    const splash = document.getElementById("ft-splash");
    const step = document.getElementById("ft-step");
    const abs = (path) => new URL(path, location.origin).href;

    // Messaggi indicativi durante il caricamento di Python.
    const steps = [
      [0, "Avvio di Python…"],
      [4000, "Caricamento librerie…"],
      [10000, "Preparazione dei grafici…"],
      [18000, "Apertura del database…"],
      [30000, "Quasi pronto…"],
    ];
    let timers = [];
    function startBootMessages() {
      timers = steps.map(([delay, text]) =>
        setTimeout(() => { step.textContent = text; }, delay)
      );
    }

    function hideSplash() {
      timers.forEach(clearTimeout);
      splash.classList.add("is-hidden");
      setTimeout(() => splash.remove(), 400);
      window.FTAndroid?.appReady?.();
    }

    // La prima pagina è pronta quando compare la barra superiore dell'app.
    const observer = new MutationObserver(() => {
      if (document.querySelector(".ft-mtop")) {
        observer.disconnect();
        hideSplash();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Se dopo 3 minuti non è partita, mostra un messaggio e "Riprova".
    function startBootTimeout() {
      setTimeout(() => {
        if (document.getElementById("ft-splash") && !document.querySelector(".ft-mtop")) {
          timers.forEach(clearTimeout);
          splash.classList.add("is-error");
          step.textContent = "L'avvio sta impiegando troppo. Riprova.";
        }
      }, 180000);
    }

    // Primo avvio: scelta della cartella dei dati (solo nell'app Android).
    await native.firstRunFolderChoice({
      pick: document.getElementById("ft-setup-pick"),
      skip: document.getElementById("ft-setup-skip"),
      error: document.getElementById("ft-setup-error"),
      show: () => splash.classList.add("is-setup"),
      hide: () => splash.classList.remove("is-setup"),
    });

    startBootMessages();
    startBootTimeout();

    const manifest = await (await fetch("/app-manifest.json")).json();

    const files = {};
    for (const path of manifest.files) {
      files[path] = { url: abs(`/app/${path}`) };
    }

    // Dati dalla cartella scelta (se c'è): prevalgono sulla copia interna.
    Object.assign(files, native.loadInitialFiles());

    window.__ftStlite = mount(
      {
        entrypoint: "app.py",
        files,
        requirements: manifest.requirements,
        pyodideUrl: abs("/pyodide/pyodide.mjs"),
        basePath: "/",
        idbfsMountpoints: ["/data"],
        env: {
          FT_PLATFORM: "android",
          FT_DATA_DIR: "/data",
          FT_PLOTLY_JS_URL: "/vendor/plotly.min.js",
        },
        streamlitConfig: {
          "client.toolbarMode": "minimal",
          "client.showErrorDetails": "full",
          "browser.gatherUsageStats": false,
          "global.developmentMode": false,
        },
        disableProgressToasts: true,
        disableModuleAutoLoadToasts: true,
      },
      document.getElementById("root"),
    );

    native.start(window.__ftStlite);
  </script>
</body>
</html>
