name: Release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm packaging/FinanceTracker.spec

          if (-not (Test-Path "dist\FinanceTracker.exe")) {
            Write-Host "Contenuto della cartella dist:"
            Get-ChildItem -Recurse dist -ErrorAction SilentlyContinue
            throw "dist\FinanceTracker.exe non è stato generato"
          }

          Get-Item "dist\FinanceTracker.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }

          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe non trovato"
          }

          & $iscc "packaging\windows\installer.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Compilazione Inno Setup fallita con codice $LASTEXITCODE"
          }

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "installer_output\*.exe" -ErrorAction SilentlyContinue

          if (-not $installer) {
            Get-ChildItem -Recurse installer_output -ErrorAction SilentlyContinue
            throw "Installer Windows non generato"
          }

          $installer | Format-Table Name, Length, LastWriteTime

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: installer_output/*.exe
          if-no-files-found: error

  build-linux:
    name: Linux .deb
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            fakeroot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Make Linux script executable
        run: chmod +x packaging/linux/build_deb.sh

      - name: Build .deb
        run: ./packaging/linux/build_deb.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-deb
          path: installer_output/*.deb
          if-no-files-found: error

  build-macos:
    name: macOS app
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Make macOS script executable
        run: chmod +x packaging/macos/build_app.sh

      - name: Build macOS .app
        run: ./packaging/macos/build_app.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-app
          path: installer_output/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-linux
      - build-macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## Download

            - **Windows:** `FinanceTracker_Setup_*.exe`
            - **Linux:** `financetracker_*.deb`
            - **macOS:** `FinanceTracker_*_macos_*.zip`

            La versione macOS non è firmata o notarizzata.