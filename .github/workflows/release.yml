name: Release builds

# Windows: build locale (PyInstaller + Inno Setup).
# Questa pipeline genera solo Linux (.deb) e macOS (.app.zip).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            fakeroot

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Build .deb
        run: ./packaging/linux/build_deb.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-deb
          path: installer_output/*.deb
          if-no-files-found: error

  build-macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Build macOS .app
        run: ./packaging/macos/build_app.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-app
          path: installer_output/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## Download
            - **Windows:** build locale → `FinanceTracker_Setup_*.exe` (caricalo a mano sulla Release se serve)
            - **Linux:** `financetracker_*.deb` → `sudo apt install ./financetracker_*.deb`
            - **macOS:** `FinanceTracker_*_macos_*.zip` → scompatta → doppio click su `FinanceTracker.app` (non notarizzato: click destro → Apri al primo avvio)
